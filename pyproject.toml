[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bg3loc"
version = "1.2.0"
description = "Cross-platform Baldur's Gate 3 localization pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "CassiaLin"}
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4"
]

[project.urls]
Repository = "https://github.com/CassiaLin/bg3loc"
Issues = "https://github.com/CassiaLin/bg3loc/issues"

[project.scripts]
bg3loc = "bg3loc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/bg3loc/schemas" = ["schemas/*.json"]
"share/bg3loc/schemas/lstp" = ["schemas/lstp/*.json"]
"share/bg3loc/schemas/research" = ["schemas/research/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
